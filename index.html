<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/techforge.css">
</head>
<body>
  <div class="application-shell">
    <header class="application-header">
      <p class="application-label">TechForge</p>
      <h1>Каталог комплектующих с загрузкой из Supabase</h1>
      <p class="application-description">Данные берутся из Supabase и автоматически переключаются на локальную базу, если в облаке категория пуста или недоступна.</p>
    </header>

    <section class="configuration-panel">
      <div class="field-group">
        <label for="supabase-url-input">Supabase URL</label>
        <input id="supabase-url-input" type="url" placeholder="https://your-project.supabase.co">
      </div>
      <div class="field-group">
        <label for="supabase-key-input">Publishable key</label>
        <input id="supabase-key-input" type="text">
      </div>
      <button id="save-supabase-settings" type="button">Сохранить подключение</button>
      <p id="connection-status" class="connection-status"></p>
    </section>

    <main class="components-layout">
      <aside>
        <h2>Категории</h2>
        <ul id="category-list" class="category-list"></ul>
      </aside>
      <section>
        <div class="components-header">
          <h2 id="active-category-title">Компоненты</h2>
          <span id="data-source-tag" class="data-source-tag">Источник: локальная база</span>
        </div>
        <ul id="component-list" class="component-list"></ul>
      </section>
    </main>
  </div>

  <script type="module" src="js/techforge.js"></script>
</body>
</html>
